name: Keep backend awake

# The free Render backend sleeps after 15 minutes without traffic, and requests that then
# arrive through Vercel's shared proxy IPs can be refused ("hibernate-rate-limited").
# Pinging it directly every 10 minutes keeps it awake. One always-on free service uses
# about 744 of the 750 free instance hours Render includes per month.
#
# Note: GitHub pauses scheduled workflows in public repos after 60 days without commits;
# re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://cropmind-chatbot-backend.onrender.com/health
