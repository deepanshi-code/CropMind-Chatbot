name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Backend tests
        run: npm test -w backend

      - name: Frontend tests
        run: npm test -w frontend

      - name: Frontend build
        run: npm run build -w frontend

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
